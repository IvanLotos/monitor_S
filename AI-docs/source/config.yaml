host: "0.0.0.0"
port: 8080
modules_dir: "./modules"
server:
  max_workers: 20
cache:
  refresh_interval: 60
module_timeout: 30
logging:
  level: INFO
  file: "logs/server.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  max_bytes: 10485760
  backup_count: 5
  module_levels: {}