prefix: "http"
secrets_file: "/etc/s/secrets.yaml"
max_workers: 20
log_level: "summary"
defaults:
  timeout: 3
  method: "GET"
  expected_status: 200
  ssl: auto
  check_content: null
  headers: {}
endpoints:
  - host: "fluentbit-host.example.com"
    port: 2020
    path: "/health"
    expected_status: 200
    check_content: "OK"
  - host: "jolokia-host.example.com"
    port: 8161
    path: "/console/jolokia"
    method: "POST"
    ssl: true
    auth_ref: "jolokia_creds"
    headers:
      Origin: "https://jolokia-host.example.com:8161"
      Content-Type: "application/json"
    body: '{"type":"read","mbean":"java.lang:type=Memory"}'
    expected_status: 200
    check_content: "used"
    timeout: 5
    log_level: "full"