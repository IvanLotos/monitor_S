config_watch_interval: 60   # -1 (отключено), 0 (только лог), >=60 (период в секундах)
host: "0.0.0.0"
port: 8080
server:
  max_workers: 20
cache:
  refresh_interval: 60
modules_dir: "./modules"
module_timeout: 30
logging:
  level: DEBUG                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  file: "logs/server.log"     # опционально, если не указан — вывод в консоль
  max_bytes: 10485760         # 10 МБ
  backup_count: 5
  module_levels:              # переопределение для конкретных модулей
    dns_check: DEBUG
    port_check: DEBUG

